# ACES full-year database -> weighted representative-day database
#
# EDITING ORDER
# 1. Set project.input_database and project.output_database.
# 2. Select clustering.engine: tsam or pyomo.
# 3. Set clustering.n_representative_days.
# 4. Select the ACES tables and profile weights under clustering.attributes.
# 5. Edit only the block for the selected engine.
# 6. Run validation before the full reduction:
#      python run_aces_tsam.py aces_tsam_8760.yaml --validate-only
#
# ACTIVE RUN
# - Engine: TSAM.
# - Clustering method: kmedoids.
# - Output representation: medoid (complete historical days).
# - Normal clusters requested: 15.
# - Extreme method: new_cluster.
# - Configured extremes: four regional peak-demand days and one NS low-wind day.
# - Final TSAM count can exceed 15 because new_cluster adds extreme clusters.

project:
  # Put the full-year SQLite database in data/ and set its path here.
  # The input file is opened read-only and is never modified.
  input_database: data/Offshore_wind_NS-NB.sqlite

  # The reduced database and audits are written under output/.
  output_database: output/Offshore_wind_NS-NB_repdays_actual_dates.sqlite

  # null copies the input database before replacing its temporal rows.
  # A local compact template can be supplied to reduce copying time, but that
  # template must have the same ACES schema and static data as the input.
  output_template_database: null

  # Optional CSV/XLSX files containing temperature, humidity, or other hourly data.
  extra_attributes_directory: extra_attributes

  # true replaces an older output with the same name. It never replaces the input.
  overwrite_output: true

  # VACUUM removes deleted full-year rows from the completed output file.
  compact_output: true

# ACES SCHEMA MAPPING
# Change this section only when the input database uses different table or column names.
aces:
  calendar:
    season_table: time_season
    season_column: t_season
    season_format: "%m-%d"
    base_year: 2024
    hour_table: time_of_day
    hour_column: t_day
    hours_per_day: 24

  weights:
    table: SegFrac
    season_column: season_name
    hour_column: time_of_day_name
    value_column: segfrac
    notes_column: segfrac_notes
    create_audit_table: true
    audit_table: RepresentativeDayWeight

  temporal_tables:
    # Each key_columns combination becomes one independent hourly profile.
    # Empty optional tables are skipped when validation.fail_on_missing_temporal_table is false.
    - table: DemandSpecificDistribution
      enabled: true
      season_column: season_name
      hour_column: time_of_day_name
      value_column: dsd
      key_columns: [regions, periods, demand_name]
      preserve_columns: [dsd_notes]
      # DSD values are weighted and normalized so every region/period/demand profile sums to 1.
      output_rule: weighted_and_normalized_to_one

    - table: CapacityFactorTech
      enabled: true
      season_column: season_name
      hour_column: time_of_day_name
      value_column: cf_tech
      key_columns: [regions, tech]
      preserve_columns: [cf_tech_notes]
      output_rule: representative_profile

    - table: CapacityFactorProcess
      enabled: true
      season_column: season_name
      hour_column: time_of_day_name
      value_column: cf_process
      key_columns: [regions, tech, vintage]
      preserve_columns: [cf_process_notes]
      output_rule: representative_profile

    - table: EfficiencyVariable
      enabled: true
      season_column: season_name
      hour_column: time_of_day_name
      value_column: efficiencyvar
      key_columns: [regions, input_comm, tech, output_comm]
      preserve_columns: [source, eff_notes]
      output_rule: representative_profile

    - table: CostVariableVariable
      enabled: true
      season_column: season_name
      hour_column: time_of_day_name
      value_column: costvarvar
      key_columns: [regions, tech]
      preserve_columns: [source, eff_notes]
      output_rule: representative_profile

clustering:
  # ENGINE OPTIONS
  # tsam  = cluster statistically similar days with TSAM.
  # pyomo = select days and weights by minimizing binned duration-curve error.
  # Only the selected engine block is used.
  engine: tsam

  # TSAM: number of normal clusters before append/new_cluster extremes are added.
  # Pyomo: exact final number, including forced extreme days.
  n_representative_days: 15

  # COMMON PROFILE SELECTION FOR BOTH ENGINES
  attributes:
    # A larger weight gives profiles from that table more influence on selection.
    # Weights do not multiply values written to the reduced ACES database.
    table_default_weights:
      DemandSpecificDistribution: 5.0
      CapacityFactorTech: 3.0
      CapacityFactorProcess: 1.0
      EfficiencyVariable: 0.0
      CostVariableVariable: 0.0

    include:
      tables:
        - DemandSpecificDistribution
        - CapacityFactorTech
        - CapacityFactorProcess
        # - EfficiencyVariable
        # - CostVariableVariable

      # Column names loaded from files in extra_attributes/.
      # Example: [temperature, humidity]
      extra_attributes: []

    exclude:
      regions: []       # Example: [LAB, PEI]
      technologies: []  # Example: [E_TRANS-USA]
      demands: []       # Example: [D_HEAT]
      columns: []       # Exact generated profile names to exclude

    # Override the table weight for exact profiles when required.
    # Example:
    # column_weight_overrides:
    #   "DemandSpecificDistribution|NS|2025|D_ELEC": 8.0
    column_weight_overrides: {}

  # ============================================================================
  # TSAM ENGINE
  # Used only when clustering.engine: tsam
  # ============================================================================
  tsam:
    # The ACES writer currently requires 24 one-hour values per representative day.
    period_duration: 24
    temporal_resolution: 1h

    cluster:
      # METHOD OPTIONS
      # hierarchical = stable general-purpose grouping; no solver required.
      # kmeans       = fast grouping around calculated centers.
      # kmedoids     = solver-based selection of central historical days.
      # kmaxoids     = emphasizes dissimilar or outer days.
      # averaging    = sequential blocks; does not group by profile similarity.
      # contiguous   = hierarchical grouping restricted to neighboring dates.
      method: kmedoids

      # REQUIRED FOR THIS ACES WRITER
      # medoid writes one complete historical day for each cluster.
      # Synthetic TSAM representations (mean, distribution, distribution_minmax,
      # minmax_mean, maxoid) are rejected because they cannot be labeled as one
      # historical source day in the current database format.
      representation:
        type: medoid

      # true reduces domination by profiles having larger numerical scales.
      normalize_column_means: true

      # false compares H00 with H00 through H23 with H23.
      # true sorts each daily profile before comparison, preserving distribution
      # but discarding the hour at which each value occurred.
      use_duration_curves: false

      # true includes each 24-hour total as an additional comparison feature.
      include_period_sums: true

      # Used only by kmedoids. Other TSAM methods ignore this solver setting.
      solver: cplex

    extremes:
      enabled: true

      # SUPPORTED METHODS
      # append      = add each extreme as a separate cluster, normally weight 1.
      # new_cluster = add each extreme as a center and reassign similar days to it.
      # Both methods can increase the final count above n_representative_days.
      #
      # NOT SUPPORTED
      # replace creates a hybrid profile and is not retained by the ACES profile
      # transfer step. Validation rejects replace; use append or new_cluster.
      method: new_cluster

      # Day containing the largest single hourly value for each exact profile.
      max_value:
        - "DemandSpecificDistribution|NL|2025|D_ELEC"
        - "DemandSpecificDistribution|NS|2025|D_ELEC"
        - "DemandSpecificDistribution|PEI|2025|D_ELEC"
        - "DemandSpecificDistribution|NB|2025|D_ELEC"

      # Day containing the smallest single hourly value for each exact profile.
      min_value: []

      # Day with the largest complete 24-hour total for each exact profile.
      max_period: []

      # Day with the smallest complete 24-hour total for each exact profile.
      # Recommended for sustained low-wind selection.
      min_period:
        - "CapacityFactorTech|NS|E_WIND-ON_EX"

    segmentation:
      # Keep false to retain H00-H23. If enabled, n_segments must remain 24 in
      # the current ACES writer, so segmentation provides no temporal reduction.
      enabled: false
      n_segments: 24
      representation:
        type: mean

    aggregate:
      # Must remain false so medoid values stay equal to the selected source day.
      preserve_column_means: false
      rescale_exclude_columns: []
      round_decimals: 8
      numerical_tolerance: 1.0e-10

  # ============================================================================
  # DURATION-CURVE OPTIMIZATION ENGINE (PYOMO)
  # Used only when clustering.engine: pyomo
  # ============================================================================
  pyomo:
    # OBJECTIVE
    # For every selected profile and duration-curve bin, compare:
    #   full-year exceedance share
    #   versus weighted representative-day exceedance share
    # Minimize the profile-weighted sum of absolute differences.

    # SOLUTION METHODS
    # opt:
    #   formulation milp          -> jointly select N days and optimize weights.
    #   formulation lp_fixed_days -> use fixed_day_ids and optimize weights only.
    # hybrid_random_weighting:
    #   randomly select N days, optimize their weights, repeat, and keep the best.
    solution_method: hybrid_random_weighting

    # VALID COMBINATIONS
    # opt + milp
    # opt + lp_fixed_days + use_integer_weights false
    # hybrid_random_weighting + milp
    formulation: milp

    # false allows fractional occurrence weights.
    # true requires whole-day weights and makes weight optimization integer-based.
    # lp_fixed_days requires false.
    use_integer_weights: false

    # Required only by opt + lp_fixed_days.
    # IDs are one-based chronological positions: 1 is the first calendar day.
    # The list must contain exactly n_representative_days unique IDs.
    fixed_day_ids: []

    # Number of exceedance thresholds per selected profile.
    # More bins improve duration-curve detail but increase model size and runtime.
    n_bins: 30

    # Profile normalization before objective construction:
    # minmax | zscore | robust | none
    normalization: minmax

    # Used only by hybrid_random_weighting.
    n_random_iterations: 10
    random_seed: 40

    # Used only by hybrid_random_weighting.
    # null draws from every candidate day. An integer first creates a reproducible
    # random pool of that size; forced extremes remain available.
    sampled_candidate_pool_size: null

    # CANDIDATE REDUCTION
    # none                 -> use all original days; mode/count below are ignored.
    # kmeans_nearest_day   -> keep the real day nearest each k-means center.
    # ward_nearest_day     -> keep the real day nearest each Ward cluster center.
    # extreme_plus_* are legacy aliases; use exact extremes below instead.
    candidate_reduction_method: ward_nearest_day

    # Used only when candidate_reduction_method is not none:
    # chronological_daily_profile = preserve H00-H23 timing.
    # daily_duration_curve         = compare sorted daily values.
    # hybrid_profile_and_duration  = use both forms.
    # summary_statistics           = use daily statistics and ramps.
    candidate_feature_mode: chronological_daily_profile

    # Required when candidate reduction is enabled. Must be between
    # n_representative_days and the number of original days.
    n_candidate_days: 250

    # Manual one-based historical day IDs that must be selected.
    # Forced days count inside n_representative_days.
    forced_day_ids: []

    extremes:
      enabled: true

      # Pyomo extremes always count inside n_representative_days.
      selection_mode: force_within_count

      max_value:
        - "DemandSpecificDistribution|NL|2025|D_ELEC"
        - "DemandSpecificDistribution|NS|2025|D_ELEC"
        - "DemandSpecificDistribution|PEI|2025|D_ELEC"
        - "DemandSpecificDistribution|NB|2025|D_ELEC"

      min_value: []
      max_period: []
      min_period:
        - "CapacityFactorTech|NS|E_WIND-ON_EX"

      # Optional system-wide rules. Exact profile rules above provide more control.
      include_peak_demand_day: false
      include_min_wind_day: false

      # Force one maximum demand-ramp day for every configured region.
      # If several regions select the same historical date, that date counts only
      # once inside n_representative_days, while every regional reason is audited.
      include_max_daily_ramp_day:
        enabled: true

        # first_model_period uses the earliest period among the selected DSD
        # profiles. An explicit period such as 2025 is also accepted.
        reference_period: first_model_period

        # all uses every region in the selected DSD profiles.
        # A subset can be supplied, for example: [NL, NS, NB, PEI]
        regions: all

        # absolute = largest change in either direction.
        # upward   = largest increase from one hour to the next.
        # downward = largest decrease from one hour to the next.
        direction: absolute

      # Force one maximum net-load-ramp day for every configured region.
      # Net load = actual electricity demand - available generation from the
      # selected existing technologies. This option is independent of the
      # normalized demand-ramp rule above.
      include_max_net_load_ramp_day:
        enabled: false  # Change to true to activate this rule.

        # Uses the earliest DSD period, or replace with an explicit value such as 2025.
        reference_period: first_model_period

        # all uses every region that has the configured demand profile.
        # Example subset: [NL, NS, NB, PEI]
        regions: all

        # absolute = largest change in either direction.
        # upward   = largest increase in net load.
        # downward = largest decrease in net load.
        direction: absolute

        demand:
          # Annual demand is converted to GW using DSD and SegFrac:
          # demand_GW = annual_energy_GWh * DSD / (SegFrac * calendar_hours).
          # Supported annual demand units are PJ, TWh, GWh, and MWh.
          annual_table: Demand
          region_column: regions
          period_column: periods
          commodity_column: demand_comm
          value_column: demand
          unit_column: demand_units
          commodity: D_ELEC

          # The matching hourly demand profile must be loaded under
          # aces.temporal_tables above.
          profile_table: DemandSpecificDistribution

          segfrac:
            # uniform_full_year assigns every source hour 1/(days*24). Use this
            # for an hourly full-year database even if it was copied from an old
            # representative-day database whose SegFrac rows were not replaced.
            # database reads and validates the table and columns below instead.
            mode: uniform_full_year
            table: SegFrac
            season_column: season_name
            hour_column: time_of_day_name
            value_column: segfrac

        existing_generation:
          # ExistingCapacity is indexed by region, technology, and vintage.
          # Every vintage row for the same region and technology is summed.
          # No lifetime or retirement filtering is applied.
          capacity_table: ExistingCapacity
          region_column: regions
          tech_column: tech
          value_column: exist_cap
          unit_column: exist_cap_units

          # Default location of hourly CF profiles. A technology can override
          # this table in its entry below. Supported capacity units are GW, MW,
          # and kW.
          capacity_factor_table: CapacityFactorTech

          # String form uses the default CF table:
          technologies:
            - E_WIND-ON_EX

          # Mapping form can identify a different loaded CF table:
          # technologies:
          #   - tech: E_WIND-ON_EX
          #     capacity_factor_table: CapacityFactorTech
          #   - tech: E_SOLPV_EX
          #     capacity_factor_table: CapacityFactorTech

    # Prevent selected days from receiving zero occurrence weight.
    enforce_positive_weight: true
    minimum_weight: 1.0

    solver:
      # highs is open source. cplex and gurobi require separate installations.
      name: cplex
      time_limit_seconds: 300
      mip_gap: 0.001
      threads: 6
      tee: true

# OUTPUT DATABASE VALIDATION
# Complete days, H00-H23 structure, and SQLite integrity are always checked.
validation:
  require_dsd_sum_one: true
  dsd_sum_tolerance: 1.0e-8
  require_segfrac_sum_one: true
  segfrac_sum_tolerance: 1.0e-8

  # false skips missing or empty optional temporal tables.
  # true requires every enabled temporal table to exist and contain data.
  fail_on_missing_temporal_table: false

# AUDIT OUTPUTS
# The reduced database and core CSV audits are always written.
outputs:
  write_excel_audit: true
  write_accuracy_metrics: true
